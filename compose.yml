# Socle commun à tous les environnements.
# Aucun port publié, aucun bind mount, aucun `target` : ces trois choses sont
# propres à un environnement et vivent dans les overrides (stack-conventions.md,
# §1 et §11). Un `docker compose -f compose.yml up` seul est donc volontairement
# incomplet — il sert au contrôle statique, pas au démarrage.
services:
  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      args:
        NGINX_VERSION: ${NGINX_VERSION}
    container_name: mmagny-web
    restart: unless-stopped
    networks:
      - mmagny

networks:
  mmagny:
    name: mmagny

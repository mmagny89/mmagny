# Production : les noms de fichiers ne portent pas d'empreinte, donc un cache
# long rendrait toute correction invisible jusqu'à expiration. Une heure est le
# compromis retenu entre fraîcheur et nombre de requêtes.
location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|webp|ico|woff2?|pdf)$ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
}

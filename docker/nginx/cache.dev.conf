# Développement : aucun cache. Les fichiers de `site/` sont montés depuis
# l'hôte, une modification doit être visible au simple rechargement — sans quoi
# chaque édition de CSS ou de JS demande un rechargement forcé, et l'on finit
# par croire à un bug du code alors que le navigateur sert une vieille copie.
location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|webp|ico|woff2?|pdf)$ {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}

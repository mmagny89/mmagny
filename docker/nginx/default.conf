server {
    listen 80;
    server_name _;

    root  /srv/site;
    index index.html;

    # Le site est un ensemble de pages statiques, pas une SPA : une URL inconnue
    # doit répondre 404, jamais servir index.html avec un code 200 — sans quoi
    # les moteurs de recherche indexent l'accueil sous chaque URL erronée.
    # `$uri.html` rend /projets équivalent à /projets.html, sans redirection.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Point de sonde du healthcheck : ne touche pas au disque, ne journalise rien.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Politique de cache des assets : dépend de l'environnement, donc fournie
    # par le stage du Dockerfile (cache.dev.conf ou cache.prod.conf).
    include /etc/nginx/snippets/cache.conf;

    location = /assets/favicon/site.webmanifest {
        add_header Cache-Control "public, max-age=86400";
    }

    # En-têtes de sécurité applicables sans casser l'existant.
    # Volontairement pas de Content-Security-Policy ici : les pages portent des
    # scripts inline (configuration tarteaucitron), qu'une CSP stricte bloquerait
    # silencieusement. Voir README.docker.md, section « Reste à faire ».
    add_header X-Content-Type-Options    "nosniff"                  always;
    add_header X-Frame-Options           "SAMEORIGIN"               always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    gzip             on;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_types       text/plain text/css text/javascript application/javascript
                     application/json image/svg+xml application/manifest+json;

    # Fichiers de configuration ou de version éventuellement déposés par erreur.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
